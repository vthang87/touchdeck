; TouchDeck / steam-dock — JC8048W550C (ESP32-S3)
; Envs: usb (first flash / recover), ota (wireless update)

[platformio]
default_envs = usb
src_dir = src
include_dir = include

[env]
platform = espressif32 @ ^6.9.0
board = jc8048w550c
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456
lib_deps =
  lvgl/lvgl @ 8.3.11
  h2zero/NimBLE-Arduino @ ^1.4.3
  ; 1.4.x still has Arduino_RPi_DPI_RGBPanel used by vendor JC8048W550 demos
  moononournation/GFX Library for Arduino @ 1.4.7
  bblanchon/ArduinoJson @ ^7.2.1
  links2004/WebSockets @ ^2.6.1
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=2
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -I src
  -DFIRMWARE_VERSION=\"0.3.1\"
  -DHARDWARE_REVISION=\"JC8048W550C-R1\"
  -DPROTOCOL_VERSION=4
  -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384

[env:usb]
upload_protocol = esptool
upload_speed = 460800

[env:ota]
upload_protocol = espota
; Override at upload time: pio run -e ota -t upload --upload-port touchdeck-xxxx.local
upload_flags =
  --auth=touchdeck
upload_port = touchdeck.local
