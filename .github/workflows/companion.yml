name: Companion

on:
  push:
    branches: [main, dev]
    paths:
      - "companion/**"
      - "web/install/**"
      - ".github/workflows/companion.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "companion/**"
      - "web/install/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
