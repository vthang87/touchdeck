name: Companion

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths:
      - "companion/**"
      - "web/install/**"
      - ".github/workflows/companion.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "companion/**"
      - "web/install/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  package-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package DMG + ZIP
        run: pnpm run dist
        env:
          # Unsigned local/CI builds — users Open once via right-click on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: touchdeck-companion-macos
          path: |
            companion/release/*.dmg
            companion/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: touchdeck-companion-macos
          path: companion-dist

      - name: Attach Companion to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: companion-dist/*
          fail_on_unmatched_files: true
          # Firmware workflow may already have created this tag's release.
