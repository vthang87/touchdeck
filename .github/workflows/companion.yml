name: Companion

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths:
      - "companion/**"
      - "protocol/**"
      - ".github/workflows/companion.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "companion/**"
      - "protocol/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build frontend + check Rust
        run: |
          pnpm run build
          cargo check --manifest-path src-tauri/Cargo.toml

  package-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package DMG
        run: pnpm run dist

      - name: Rename artifacts
        run: |
          mkdir -p release
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64) ARCH_LABEL=arm64 ;;
            x86_64) ARCH_LABEL=x64 ;;
            *) ARCH_LABEL="$ARCH" ;;
          esac
          VERSION=$(node -p "require('./package.json').version")
          APP_DMG=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          if [[ -z "$APP_DMG" ]]; then
            echo "No DMG found" >&2
            find src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          OUT="release/TouchDeck-Companion-${VERSION}-mac-${ARCH_LABEL}.dmg"
          cp "$APP_DMG" "$OUT"
          ls -lh release/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: touchdeck-companion-macos
          path: companion/release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: touchdeck-companion-macos
          path: companion-dist

      - name: Attach Companion to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: companion-dist/*
          fail_on_unmatched_files: true
