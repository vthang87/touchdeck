name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, dev]
    paths:
      - "web/**"
      - "include/version.h"
      - "scripts/sync-web-installer.sh"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync installer assets
        run: |
          chmod +x scripts/sync-web-installer.sh
          ./scripts/sync-web-installer.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/worker/pnpm-lock.yaml

      - name: Install worker dependencies
        working-directory: web/worker
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        working-directory: web/worker
        run: pnpm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Gate deploy (skip without Cloudflare secrets)
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN not configured — skipping deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Sync installer assets
        if: steps.gate.outputs.deploy == 'true'
        run: |
          chmod +x scripts/sync-web-installer.sh
          ./scripts/sync-web-installer.sh

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/worker/pnpm-lock.yaml

      - name: Install worker dependencies
        if: steps.gate.outputs.deploy == 'true'
        working-directory: web/worker
        run: pnpm install --frozen-lockfile

      - name: Deploy production (main)
        if: steps.gate.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/worker
          command: deploy --env="" --var GITHUB_REPOSITORY:${{ github.repository }}

      - name: Deploy staging (dev)
        if: steps.gate.outputs.deploy == 'true' && github.ref == 'refs/heads/dev'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/worker
          command: deploy --env dev --var GITHUB_REPOSITORY:${{ github.repository }}
