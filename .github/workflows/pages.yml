name: Web Installer (Pages)

# Deploys web/install to GitHub Pages alongside Cloudflare Worker (cloudflare.yml).
on:
  push:
    branches: [main]
    paths:
      - "web/install/**"
      - "docs/images/**"
      - "firmware/include/version.h"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync doc screenshots into installer assets
        run: |
          mkdir -p web/install/assets
          for f in media-page.png home-grid.png grid-editor.png device-settings.png companion-ui.png; do
            if [[ -f "docs/images/$f" ]]; then
              cp "docs/images/$f" "web/install/assets/$f"
            fi
          done
          ls -la web/install/assets

      - name: Write Pages manifest (firmware from GitHub Releases)
        env:
          FIRMWARE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          chmod +x scripts/package-firmware-bundle.sh
          VERSION=$(grep -E '^#define FIRMWARE_VERSION' firmware/include/version.h | sed 's/.*"\(.*\)".*/\1/')
          export VERSION FIRMWARE_BASE_URL
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          base = os.environ["FIRMWARE_BASE_URL"].rstrip("/") + "/"
          p = Path("web/install/manifest.json")
          data = json.loads(p.read_text())
          data["version"] = version
          data["firmwareBaseUrl"] = base
          p.write_text(json.dumps(data, indent=2) + "\n")
          print(f"Pages manifest v{version} → {base}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Pages must be enabled once in repo Settings → Pages → Source: GitHub Actions

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/install

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
