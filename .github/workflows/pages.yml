name: Web Installer (Pages)

# Primary web installer deploy is Cloudflare Worker (see cloudflare.yml).
# Run this workflow manually only if you enable GitHub Pages on the repo.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Pages manifest (firmware from GitHub Releases)
        env:
          FIRMWARE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          chmod +x scripts/package-firmware-bundle.sh
          VERSION=$(grep -E '^#define FIRMWARE_VERSION' include/version.h | sed 's/.*"\(.*\)".*/\1/')
          export VERSION FIRMWARE_BASE_URL
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          base = os.environ["FIRMWARE_BASE_URL"].rstrip("/") + "/"
          p = Path("web/install/manifest.json")
          data = json.loads(p.read_text())
          data["version"] = version
          data["firmwareBaseUrl"] = base
          p.write_text(json.dumps(data, indent=2) + "\n")
          print(f"Pages manifest v{version} → {base}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/install

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
